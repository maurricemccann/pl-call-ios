name: build

# Started by hand only. Builds an unsigned .ipa, publishes it as a release together with the
# SideStore source file; SideStore signs the app on the phone.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project PLCall.xcodeproj \
            -target PLCall \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/PLCall.app Payload/
          zip -qr PLCall.ipa Payload
          ls -l PLCall.ipa

      - name: Write the SideStore source
        run: |
          python3 scripts/make_source.py \
            --app build/Release-iphoneos/PLCall.app \
            --ipa PLCall.ipa \
            --repo "${{ github.repository }}" \
            --tag "build-${{ github.run_number }}" \
            --out source.json
          cat source.json

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" PLCall.ipa source.json \
            --title "Build ${{ github.run_number }}" \
            --notes "Unsigned build, signed on the phone by SideStore." \
            --latest

      - uses: actions/upload-artifact@v4
        with:
          name: PLCall-ipa
          path: PLCall.ipa
          retention-days: 14
